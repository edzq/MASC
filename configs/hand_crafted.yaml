# Who&When -- Hand-Crafted subset, w/o GT (the 'HC w/o GT' column of Table 1).
# Hyperparameters follow Table 6 of the paper.
data_root: data/Who&When
subset: Hand-Crafted
split_dir: data/splits
include_ground_truth: false
# The first history entry of a Hand-Crafted trajectory is already the human's
# question, so no separate query is prepended.
include_query: false

encoder_model: sentence-transformers/all-MiniLM-L6-v2
base_model: meta-llama/Llama-3.1-8B-Instruct
freeze_backbone: true
device_map: auto
dtype: bfloat16
num_heads: 4

epochs: 10
lr: 1.0e-4
weight_decay: 0.0
lambda_proto: 0.1
loss_threshold: 0.1
seed: 42

scoring_mode: teacher_forcing
alpha: 1.0
beta: 0.1
threshold: 0.5
test_truncation: at_error

output_dir: outputs/masc/hand_crafted
