[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masc"
version = "1.0.0"
description = "Metacognitive Self-Correction for Multi-Agent Systems via Prototype-Guided Next-Execution Reconstruction"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["multi-agent-systems", "llm", "anomaly-detection", "failure-attribution"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "accelerate>=0.30",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7", "scipy>=1.10"]
baselines = ["openai>=1.40", "python-dotenv>=1.0", "huggingface-hub>=0.24"]

[tool.setuptools]
packages = ["masc"]
